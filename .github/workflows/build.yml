name: "Main / Pull requests build"

env:
  acapi_token: ${{secrets.ACAPI_TOKEN}}
# ArmorCode env
  armorcodehost: https://eu.armorcode.com
  product: webgoat
  subProduct: webgoat
  environment: Production
  token: ${{secrets.ARMORCODE_TOKEN}}
  fetch_token: ${{secrets.FETCH_TRIGGER}}
  buildTool: GITHUB_ACTIONS
  buildNumber: ${{github.run_number}}
  end: 6
  
on:
    pull_request:
        paths-ignore:
            - '.txt'
            - 'LICENSE'
            - 'docs/**'
        branches: [ main ]
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ ubuntu-latest ]
        steps:
             # trigger results fetch
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: '25'
            - name: Cache SonarQube packages
              uses: actions/cache@v4
              with:
                path: ~/.sonar/cache
                key: ${{ runner.os }}-sonar
                restore-keys: ${{ runner.os }}-sonar
            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                path: ~/.m2
                key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                restore-keys: ${{ runner.os }}-m2
            - name: Build and analyze
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
              run: mvn -B compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Webgoat -Dsonar.projectName='Webgoat'
            - run: |
                  curl --header "Content-Type: application/json" \
                       -H "Authorization: Bearer $fetch_token" \
                      --request POST \
                      --data '{"product":"webgoat","subproduct":"webgoat","engagementId":null,"env":"Production","toolConfigId":2703243}' \
                      https://eu.armorcode.com/user/tools/generic/import/?toolName=Dependabot
             # ArmorCode build gate
            - run: |
                  wget https://eu.armorcode.com/static/scripts/slastatus.sh
                  sh slastatus.sh
